# config.toml — shared runtime configuration for client and server.
# All keys are optional; missing keys fall back to compiled-in defaults.

[client-network]
host = "127.0.0.1"
port = 9999

[server-network]
host = "127.0.0.1"
port = 9999

[server-replication]
# How often the server emits a full registry snapshot to each client.
# The simulation tick rate stays at 128 Hz regardless (deterministic
# physics requires a fixed dt); only the wire-rate of state replication
# is affected.
#
# PR-13 default: 128 Hz — Valorant / CS2 / Apex tournament cadence.
# PR-10 (snapshot delta encoding) cut wire bytes ~5×, so 128 Hz today
# costs less than the pre-PR-10 32 Hz baseline.  Combined with PR-11
# (entity interpolation buffer) and PR-12 (lag-comp + cl_interp), the
# 2-snapshot render delay drops to ~16 ms — visually indistinguishable
# from a fully un-delayed renderer for human reaction times.
#
# Override values:
#   * 128 — default, AAA pro feel; render delay ≈ 16 ms.
#   * 64  — half-rate; render delay ≈ 31 ms.  Cuts wire BW by ~50 %.
#   * 32  — quarter-rate; legacy default.  Render delay ≈ 62 ms.
#           Choose this if running on a constrained network.
snapshot-hz = 128

[global-discovery]
# Global server browser / central directory service. The directory server
# executable listens on the UDP port; the game server auto-registers here
# from its gameplay UDP socket, clients refresh this directory from the Home
# screen, and relay fallback uses the same UDP service.
enabled = true
advertise-server = true
directory-host = "157.245.233.91"
directory-udp-port = 10081
server-name = "Palantir"
max-players = 8
refresh-seconds = 5
connect-punch-timeout-ms = 900
relay-fallback-delay-ms = 450

[transport]
# UDP-first networking. Keep the legacy TCP path available during the
# staged cutover, but default all normal runtime traffic to UDP sessions.
use-udp-sessions = true
allow-legacy-tcp-fallback = true
force-relay = false
enable-udp-sidecar = true
inputs-over-udp = true
ping-over-udp = true
snapshots-over-udp = true
events-over-udp = true

[graphics]
# GPU backend selection.  Falls back to other available backends if the
# requested one is unavailable on this machine.
#   "auto"        — let SDL pick the best backend for the platform
#   "direct3d12"  — Windows: Direct3D 12 (default on Windows)
#   "vulkan"      — Vulkan (default on Linux; available on Windows as fallback)
#   "metal"       — macOS: Metal (default on macOS)
backend = "auto"

[developer]
# When true, the client starts directly in-game and the server automatically
# advances lobby phases into countdowns. Intended for local gameplay iteration.
skip_lobby = true
