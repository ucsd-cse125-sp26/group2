name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ #
  #  Debug build — PRs only; release build covers main                  #
  # ------------------------------------------------------------------ #
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'pull_request'
    env:
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            preset: debug
            cc: clang
            cxx: clang++

          - name: macOS
            os: macos-latest
            preset: debug
            cc: clang
            cxx: clang++

          - name: Windows
            os: windows-latest
            preset: debug
            cc: clang-cl
            cxx: clang-cl

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Windows C: drive is slow (~4K IOPS); a Dev Drive VHDX gives ~128K IOPS.
      # Creates a ReFS virtual disk and moves the workspace there.
      - name: Setup Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@v3
        with:
          workspace-copy: true
          drive-size: 4GB

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang clang-format-18 clang-tidy \
            glslang-tools spirv-cross \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxkbcommon-dev libxtst-dev \
            libwayland-dev wayland-protocols \
            libpulse-dev libasound2-dev \
            libdbus-1-dev libudev-dev \
            libgl-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          which ninja || brew install ninja
          brew install glslang spirv-cross
          echo "$(brew --prefix glslang)/bin"    >> "$GITHUB_PATH"
          echo "$(brew --prefix spirv-cross)/bin" >> "$GITHUB_PATH"

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Vulkan SDK provides glslc (GLSL → SPIR-V) and spirv-cross (SPIR-V → MSL).
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          cache: true

      # Strawberry Perl ships a ccache.exe that hijacks compiler launcher
      # invocations and breaks RC (resource compiler) dep tracking.
      - name: Remove Strawberry ccache (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: rm -f /c/Strawberry/c/bin/ccache.exe

      # Pin to v0.14.0 — v0.15.0 has cache-write errors on GHA.
      # Windows uses clang-cl (not MSVC cl) so sccache works on all platforms.
      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.9
        with:
          version: "v0.14.0"

      # Cache dep sources AND their build dirs (CMakeCache.txt holds
      # try_compile results, compiler probes, feature detection).
      # Keeping build dirs lets cmake skip ~68 compile probes on re-runs.
      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: .deps/${{ matrix.preset }}
          key: deps-v4-${{ runner.os }}-${{ matrix.preset }}-${{ matrix.cc }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-v4-${{ runner.os }}-${{ matrix.preset }}-${{ matrix.cc }}-

      # Cache the project build tree for incremental cmake reconfigure.
      # CMakeCache.txt + CMakeFiles hold cached probe results; Ninja
      # tracks source deps, so stale objects are never used.
      - name: Cache build tree
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}
          key: build-v1-${{ runner.os }}-${{ matrix.preset }}-${{ matrix.cc }}-${{ github.sha }}
          restore-keys: build-v1-${{ runner.os }}-${{ matrix.preset }}-${{ matrix.cc }}-

      - name: Configure
        shell: bash
        env:
          CC:  ${{ matrix.cc  || '' }}
          CXX: ${{ matrix.cxx || '' }}
        run: |
          cmake --preset ${{ matrix.preset }} \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON \
            ${{ matrix.extra_cmake || '' }}

      - name: Build
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }} --target client server --parallel

  # ------------------------------------------------------------------ #
  #  Format check — pinned to clang-format-18 (ships on ubuntu-24.04)  #
  # ------------------------------------------------------------------ #
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format-18
        run: sudo apt-get install -y clang-format-18
      - name: Check formatting
        run: |
          find src -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \) \
            | xargs clang-format-18 --dry-run --Werror

  # ------------------------------------------------------------------ #
  #  Release builds — optimised, no sanitizers                          #
  #  Runs on: push to main  →  auto-versioned release (semver)         #
  #                                                                      #
  #  Each platform produces ONE zip containing:                          #
  #    client + server + shaders/ + config.toml + assets/                #
  # ------------------------------------------------------------------ #
  release-build:
    name: Release Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push'
    env:
      SCCACHE_GHA_ENABLED: "true"
      # Google Drive file ID for the shared assets zip.
      ASSETS_GDRIVE_ID: "1_Xafht6-R_E8-gVglYFDAHvjZA8msfE4"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            preset: release
            cc: clang
            cxx: clang++
            build_dir: build/release
            client_bin: client
            server_bin: server
            archive_suffix: linux-x86_64

          - name: macOS
            os: macos-latest
            preset: release
            cc: clang
            cxx: clang++
            build_dir: build/release
            client_bin: client
            server_bin: server
            archive_suffix: macos

          - name: Windows
            os: windows-latest
            preset: release
            cc: clang-cl
            cxx: clang-cl
            build_dir: build/release
            client_bin: client.exe
            server_bin: server.exe
            archive_suffix: windows-x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Windows C: drive is slow (~4K IOPS); a Dev Drive VHDX gives ~128K IOPS.
      - name: Setup Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@v3
        with:
          workspace-copy: true
          drive-size: 4GB

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang \
            glslang-tools spirv-cross \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxkbcommon-dev libxtst-dev \
            libwayland-dev wayland-protocols \
            libpulse-dev libasound2-dev \
            libdbus-1-dev libudev-dev \
            libgl-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          which ninja || brew install ninja
          brew install glslang spirv-cross
          echo "$(brew --prefix glslang)/bin"    >> "$GITHUB_PATH"
          echo "$(brew --prefix spirv-cross)/bin" >> "$GITHUB_PATH"

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Vulkan SDK provides glslc (GLSL → SPIR-V) and spirv-cross (SPIR-V → MSL).
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          cache: true

      # Ensure Python is available consistently across all runners (for gdown).
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Strawberry Perl ships a ccache.exe that hijacks compiler launcher
      # invocations and breaks RC (resource compiler) dep tracking.
      - name: Remove Strawberry ccache (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: rm -f /c/Strawberry/c/bin/ccache.exe

      # Pin to v0.14.0 — v0.15.0 has cache-write errors on GHA.
      # Windows uses clang-cl (not MSVC cl) so sccache works on all platforms.
      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.9
        with:
          version: "v0.14.0"

      # Cache dep sources AND their build dirs (CMakeCache.txt holds
      # try_compile results, compiler probes, feature detection).
      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: .deps/${{ matrix.preset }}
          key: deps-v4-${{ runner.os }}-${{ matrix.preset }}-${{ matrix.cc }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-v4-${{ runner.os }}-${{ matrix.preset }}-${{ matrix.cc }}-

      # Cache the project build tree for incremental cmake reconfigure.
      - name: Cache build tree
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}
          key: build-v1-${{ runner.os }}-${{ matrix.preset }}-${{ matrix.cc }}-${{ github.sha }}
          restore-keys: build-v1-${{ runner.os }}-${{ matrix.preset }}-${{ matrix.cc }}-

      - name: Configure
        shell: bash
        env:
          CC:  ${{ matrix.cc  || '' }}
          CXX: ${{ matrix.cxx || '' }}
        run: |
          cmake --preset ${{ matrix.preset }} \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON \
            ${{ matrix.extra_cmake || '' }}

      - name: Build
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }} --target client server --parallel

      # Download the shared assets zip from Google Drive (cached across runs).
      - name: Cache assets
        id: assets-cache
        uses: actions/cache@v4
        with:
          path: assets.zip
          key: assets-${{ env.ASSETS_GDRIVE_ID }}

      - name: Download assets
        if: steps.assets-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          pip install --quiet gdown
          gdown "https://drive.google.com/uc?id=${ASSETS_GDRIVE_ID}" -O assets.zip

      # Bundle client + server + shaders + config + assets into a single zip.
      - name: Package release
        shell: bash
        run: |
          DIR="group2-${{ matrix.archive_suffix }}"
          STAGE="staging/$DIR"
          mkdir -p "$STAGE"

          # Executables
          cp "${{ matrix.build_dir }}/${{ matrix.client_bin }}" "$STAGE/"
          cp "${{ matrix.build_dir }}/${{ matrix.server_bin }}" "$STAGE/"

          # Config
          cp "${{ matrix.build_dir }}/config.toml" "$STAGE/"

          # Compiled SPIR-V shaders (legacy set used by the client target)
          cp -r "${{ matrix.build_dir }}/shaders" "$STAGE/"

          # Assets from Google Drive (cross-platform extraction via Python)
          python3 -c "import zipfile; zipfile.ZipFile('assets.zip').extractall('$STAGE')"

          # Create release zip.
          # Linux/macOS have zip pre-installed; Windows has 7z instead.
          cd staging
          if command -v zip &>/dev/null; then
            zip -r "../$DIR.zip" "$DIR"
          else
            7z a -tzip "../$DIR.zip" "$DIR"
          fi

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: group2-${{ matrix.archive_suffix }}
          path: group2-${{ matrix.archive_suffix }}.zip
          retention-days: 7

  # ------------------------------------------------------------------ #
  #  Publish to GitHub Releases once all three platform builds succeed  #
  #                                                                      #
  #  Auto-semantic-versioning from commit messages:                      #
  #    BREAKING CHANGE / feat!:  →  bump major                          #
  #    feat:                     →  bump minor                          #
  #    everything else           →  bump patch                          #
  #  First release starts at v0.1.0.                                    #
  # ------------------------------------------------------------------ #
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: release-build
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      # Full history + tags needed to compute the next semantic version.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Compute next semantic version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find the latest version tag (supports both vX.Y.Z and X.Y.Z)
          LATEST_TAG=$(git tag -l --sort=-version:refname \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)

          if [[ -z "$LATEST_TAG" ]]; then
            # No version tags yet — start at v0.1.0
            NEXT="v0.1.0"
            echo "previous=" >> "$GITHUB_OUTPUT"
          else
            echo "previous=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
            # Strip optional 'v' prefix for parsing
            VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            # Collect commit subjects for bump analysis.
            # Use --first-parent for clean main-branch view, and resolve
            # PR merge commits to their actual PR title so that
            # "feat:" / "fix:" in PR titles drive the version bump.
            SUBJECTS=""
            while IFS= read -r line || [[ -n "$line" ]]; do
              if [[ "$line" =~ ^Merge\ pull\ request\ \#([0-9]+) ]]; then
                PR_TITLE=$(gh pr view "${BASH_REMATCH[1]}" \
                  --json title --jq .title 2>/dev/null || echo "")
                [[ -n "$PR_TITLE" ]] && SUBJECTS="${SUBJECTS}${PR_TITLE}"$'\n'
              else
                SUBJECTS="${SUBJECTS}${line}"$'\n'
              fi
            done < <(git log "${LATEST_TAG}..HEAD" --first-parent --pretty=format:"%s")

            if echo "$SUBJECTS" | grep -qiE 'BREAKING[- ]CHANGE|^[a-z]+(\(.+\))?!:'; then
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
            elif echo "$SUBJECTS" | grep -qiE '^feat(\(.+\))?:'; then
              MINOR=$((MINOR + 1)); PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi

            NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "tag=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "### Computed version: ${NEXT}" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate changelog
        id: changelog
        env:
          GH_TOKEN: ${{ github.token }}
          PREV_TAG:     ${{ steps.version.outputs.previous }}
          RELEASE_TAG:  ${{ steps.version.outputs.tag }}
        run: |
          RANGE="${PREV_TAG:+${PREV_TAG}..HEAD}"
          RANGE="${RANGE:-HEAD}"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"

          # ── Categorise commits (first-parent = clean main-branch view) ──
          FEATS=""
          FIXES=""
          OTHER=""
          # Format: subject<TAB>author name
          while IFS=$'\t' read -r subject author || [[ -n "$subject" ]]; do
            # Skip "Merge branch" noise (e.g. back-merges)
            [[ "$subject" =~ ^Merge\ branch ]] && continue

            # For PR merge commits, fetch the real PR title and author
            if [[ "$subject" =~ ^Merge\ pull\ request\ \#([0-9]+) ]]; then
              PR_NUM="${BASH_REMATCH[1]}"
              PR_INFO=$(gh pr view "$PR_NUM" --json title,author \
                --jq '"@\(.author.login): \(.title)"' 2>/dev/null || echo "")
              if [[ -n "$PR_INFO" ]]; then
                PR_AUTHOR="${PR_INFO%%:*}"
                PR_TITLE="${PR_INFO#*: }"
                subject="$PR_TITLE"
                author="$PR_AUTHOR"
                ENTRY="${subject} — ${author} (#${PR_NUM})"
              else
                continue  # can't resolve PR, skip
              fi
            else
              ENTRY="${subject} — ${author}"
            fi

            if echo "$subject" | grep -qiE '^feat(\(.+\))?[!]?:'; then
              FEATS="${FEATS}\n- ${ENTRY}"
            elif echo "$subject" | grep -qiE '^fix(\(.+\))?[!]?:'; then
              FIXES="${FIXES}\n- ${ENTRY}"
            else
              OTHER="${OTHER}\n- ${ENTRY}"
            fi
          done < <(git log "$RANGE" --first-parent --pretty=format:"%s%x09%an" --reverse)

          # ── Build categorised section ──
          CHANGELOG=""
          if [[ -n "$FEATS" ]]; then
            CHANGELOG="${CHANGELOG}## Features\n${FEATS}\n\n"
          fi
          if [[ -n "$FIXES" ]]; then
            CHANGELOG="${CHANGELOG}## Fixes\n${FIXES}\n\n"
          fi
          if [[ -n "$OTHER" ]]; then
            CHANGELOG="${CHANGELOG}## Other\n${OTHER}\n\n"
          fi

          # ── Append GitHub-generated PR details & contributors ──
          # This adds "New Contributors" and linked PR references when
          # changes came through pull requests.
          GH_NOTES=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${RELEASE_TAG}" \
            -f target_commitish="${GITHUB_SHA}" \
            ${PREV_TAG:+-f previous_tag_name="${PREV_TAG}"} \
            --jq '.body' 2>/dev/null || echo "")

          # Extract only the "New Contributors" and "Full Changelog" sections
          # (skip "What's Changed" — our categorised list replaces it)
          if [[ -n "$GH_NOTES" ]]; then
            CONTRIBUTORS=$(echo "$GH_NOTES" | sed -n '/^## New Contributors/,$p')
            if [[ -n "$CONTRIBUTORS" ]]; then
              CHANGELOG="${CHANGELOG}${CONTRIBUTORS}\n\n"
            fi
          fi

          # Compare link
          if [[ -n "$PREV_TAG" ]]; then
            CHANGELOG="${CHANGELOG}**Full changelog**: ${REPO_URL}/compare/${PREV_TAG}...${RELEASE_TAG}"
          fi

          echo -e "$CHANGELOG" > changelog.md

      # Ask Gemini to write a short human-readable summary of the changes.
      # Sends the categorised changelog AND detailed per-commit stats
      # (files changed, insertions, deletions, diffstat) so the summary
      # is well-informed.  Falls back gracefully — if the API call fails
      # the release still ships with just the categorised changelog.
      - name: Generate AI summary
        id: summary
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI }}
          PREV_TAG: ${{ steps.version.outputs.previous }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          CHANGELOG=$(cat changelog.md)

          RANGE="${PREV_TAG:+${PREV_TAG}..HEAD}"
          RANGE="${RANGE:-HEAD}"

          # Detailed per-commit info: hash, subject, author, date,
          # plus --stat showing which files changed and how much.
          COMMIT_DETAILS=$(git log "$RANGE" --first-parent \
            --format="%n--- commit %h ---  %s  (%an, %ad)%n" --date=short \
            --stat --stat-width=120 2>/dev/null || echo "")

          # Overall diffstat summary (total files, insertions, deletions)
          DIFF_SUMMARY=$(git diff --stat --stat-width=120 \
            "${PREV_TAG:-$(git rev-list --max-parents=0 HEAD | head -1)}"..HEAD \
            2>/dev/null | tail -1 || echo "")

          # Build the JSON payload with jq to avoid injection from
          # commit messages or file paths.
          PAYLOAD=$(jq -n \
            --arg changelog "$CHANGELOG" \
            --arg commits "$COMMIT_DETAILS" \
            --arg diffstat "$DIFF_SUMMARY" \
            --arg version "$RELEASE_TAG" \
            '{
              "contents": [{
                "parts": [{
                  "text": ("You are writing a release summary for version " + $version + " of a multiplayer C++ FPS game engine.\n\nWrite a concise 2-4 sentence summary that describes what changed in this release. Focus on what matters to players and developers: new gameplay features, bug fixes, performance improvements, infrastructure changes. Be specific about what was added or fixed, referencing actual system names when relevant.\n\nDo not use emoji. Do not use markdown formatting. Just plain text sentences.\n\nCategorised changelog:\n" + $changelog + "\n\nDetailed commit info (commit hash, message, author, date, files changed):\n" + $commits + "\n\nOverall diff statistics:\n" + $diffstat)
                }]
              }],
              "generationConfig": {
                "maxOutputTokens": 300,
                "temperature": 0.3
              }
            }')

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            --max-time 15) || true

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [[ "$HTTP_CODE" == "200" ]]; then
            SUMMARY=$(echo "$BODY" | jq -r '.candidates[0].content.parts[0].text // empty' 2>/dev/null || echo "")
            if [[ -n "$SUMMARY" ]]; then
              echo "$SUMMARY" > summary.txt
              echo "has_summary=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_summary=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Gemini API returned HTTP $HTTP_CODE — skipping summary."
            echo "has_summary=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble release notes
        run: |
          BODY=""
          if [[ -f summary.txt ]]; then
            SUMMARY=$(cat summary.txt)
            BODY="## Summary\n${SUMMARY}\n\n"
          fi
          BODY="${BODY}$(cat changelog.md)"
          echo -e "$BODY" > release-notes.md

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          TITLE="${RELEASE_TAG} (${DATE})"

          gh release create "$RELEASE_TAG" \
            --title "$TITLE" \
            --notes-file release-notes.md \
            --latest \
            group2-linux-x86_64.zip \
            group2-macos.zip \
            group2-windows-x86_64.zip
