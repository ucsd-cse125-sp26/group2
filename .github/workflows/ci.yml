name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ #
  #  Debug build — PRs only; release build covers main                  #
  # ------------------------------------------------------------------ #
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'pull_request'
    env:
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            preset: debug
            cc: clang
            cxx: clang++

          - name: macOS
            os: macos-latest
            preset: debug
            cc: clang
            cxx: clang++

          - name: Windows
            os: windows-latest
            preset: debug
            cc: clang-cl
            cxx: clang-cl

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Windows C: drive is slow (~4K IOPS); a Dev Drive VHDX gives ~128K IOPS.
      # Creates a ReFS virtual disk and moves the workspace there.
      - name: Setup Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@v3
        with:
          workspace-copy: true
          drive-size: 4GB

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang clang-format-18 clang-tidy \
            glslang-tools spirv-cross \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxkbcommon-dev libxtst-dev \
            libwayland-dev wayland-protocols \
            libpulse-dev libasound2-dev \
            libdbus-1-dev libudev-dev \
            libgl-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          which ninja || brew install ninja
          brew install glslang spirv-cross
          echo "$(brew --prefix glslang)/bin"    >> "$GITHUB_PATH"
          echo "$(brew --prefix spirv-cross)/bin" >> "$GITHUB_PATH"

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Vulkan SDK provides glslc (GLSL → SPIR-V) and spirv-cross (SPIR-V → MSL).
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          cache: true

      # Strawberry Perl ships a ccache.exe that hijacks compiler launcher
      # invocations and breaks RC (resource compiler) dep tracking.
      - name: Remove Strawberry ccache (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: rm -f /c/Strawberry/c/bin/ccache.exe

      # Pin to v0.14.0 — v0.15.0 has cache-write errors on GHA.
      # Windows uses clang-cl (not MSVC cl) so sccache works on all platforms.
      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.9
        with:
          version: "v0.14.0"

      # Cache dep sources AND their build dirs (CMakeCache.txt holds
      # try_compile results, compiler probes, feature detection).
      # Keeping build dirs lets cmake skip ~68 compile probes on re-runs.
      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: .deps/${{ matrix.preset }}
          key: deps-v4-${{ runner.os }}-${{ matrix.preset }}-${{ matrix.cc }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-v4-${{ runner.os }}-${{ matrix.preset }}-${{ matrix.cc }}-

      # Cache the project build tree for incremental CMake reconfigure.
      # CMakeCache.txt + CMakeFiles hold cached probe results; Ninja tracks
      # source deps, but generated PCH/object files are still tied to the
      # exact compiler identity. On Windows, clang-cl encodes _MSC_FULL_VER in
      # its PCH target, which can change even when VCToolsVersion does not.
      - name: Compute compiler cache fingerprint
        id: compiler-cache
        shell: bash
        env:
          CC: ${{ matrix.cc || '' }}
          CXX: ${{ matrix.cxx || '' }}
        run: |
          # GHA's `shell: bash` runs with `-e -o pipefail`. Both probes below
          # close the pipe early (head -n 1, awk … exit), which sends SIGPIPE
          # to the compiler and surfaces as a non-zero pipe stage that
          # pipefail would propagate. Disable pipefail for this whole probe
          # — partial fingerprint data is fine, the fallback inputs
          # (VCToolsVersion, WindowsSDKVersion) still vary the cache key.
          set +o pipefail
          compiler="${CXX:-${CC:-c++}}"
          version="$("$compiler" --version 2>&1 | head -n 1 | tr -d '\r' || true)"
          msvc_full_ver=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            msvc_full_ver="$(printf '' | "$compiler" /nologo /EP /clang:-dM /TP - 2>/dev/null \
              | awk '/#define _MSC_FULL_VER/ { print $3; exit }' || true)"
          fi
          fingerprint="${RUNNER_OS}|${compiler}|${version}|${VCToolsVersion:-}|${WindowsSDKVersion:-}|${msvc_full_ver}"
          echo "Compiler cache fingerprint: $fingerprint"
          if command -v sha256sum >/dev/null 2>&1; then
            key="$(printf '%s' "$fingerprint" | sha256sum | cut -d' ' -f1)"
          else
            key="$(printf '%s' "$fingerprint" | shasum -a 256 | cut -d' ' -f1)"
          fi
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "Compiler cache fingerprint: \`$fingerprint\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Cache build tree
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}
          key: build-v4-${{ runner.os }}-${{ env.ImageVersion }}-${{ steps.compiler-cache.outputs.key }}-${{ matrix.preset }}-${{ matrix.cc }}-${{ github.sha }}
          restore-keys: build-v4-${{ runner.os }}-${{ env.ImageVersion }}-${{ steps.compiler-cache.outputs.key }}-${{ matrix.preset }}-${{ matrix.cc }}-

      # Runner images periodically refresh system headers (Linux:
      # asm-generic/errno-base.h, macOS: SDK rev, Windows: clang-cl PCH
      # ties to _MSC_FULL_VER). A cached PCH built against the previous
      # mtime then fails with "file has been modified since the precompiled
      # header was built". Drop just the PCHs from both the FetchContent
      # deps cache and the project build tree — the rest of the caches
      # stay valid and the PCH regenerates on the next build.
      - name: Drop cached PCH files
        shell: bash
        run: |
          for dir in ".deps/${{ matrix.preset }}" "build/${{ matrix.preset }}"; do
            [ -d "$dir" ] || continue
            find "$dir" -type f \( -name "*.pch" -o -name "cmake_pch*.obj" \) -print -delete
          done

      - name: Configure
        shell: bash
        env:
          CC:  ${{ matrix.cc  || '' }}
          CXX: ${{ matrix.cxx || '' }}
        run: |
          cmake --preset ${{ matrix.preset }} \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON \
            ${{ matrix.extra_cmake || '' }}

      - name: Build
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }} --target group2 server clientbot --parallel

  # ------------------------------------------------------------------ #
  #  Format check — pinned to clang-format-18 (ships on ubuntu-24.04)  #
  # ------------------------------------------------------------------ #
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format-18
        run: sudo apt-get install -y clang-format-18
      - name: Check formatting
        run: |
          find src -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \) \
            | xargs clang-format-18 --dry-run --Werror

  # ------------------------------------------------------------------ #
  #  Fetch shared assets from the CSE125 server                         #
  #                                                                      #
  #  Runs once on Linux and uploads as a workflow artifact so each       #
  #  matrix release-build can download it without needing rsync          #
  #  available on Windows runners — and we only hit the server once.   #
  # ------------------------------------------------------------------ #
  fetch-assets:
    name: Fetch Assets
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Set up SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 222 cse125.ucsd.edu >> ~/.ssh/known_hosts

      - name: Fetch assets via rsync
        run: |
          mkdir -p assets
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -p 222 -o StrictHostKeyChecking=yes" \
            dkatulevskiy@cse125.ucsd.edu:/home/dkatulevskiy/group2-assets/ \
            ./assets/

      - name: Upload assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-assets
          path: assets/
          retention-days: 1
          include-hidden-files: true

  # ------------------------------------------------------------------ #
  #  Release builds — optimised, no sanitizers                          #
  #  Runs on: push to main  →  auto-versioned release (semver)         #
  #                                                                      #
  #  Each platform produces ONE zip containing:                          #
  #    group2 + server + shaders/ + shaders-new/ + config.toml + assets/ #
  # ------------------------------------------------------------------ #
  release-build:
    name: Release Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: fetch-assets
    if: github.event_name == 'push'
    env:
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            preset: release
            cc: clang
            cxx: clang++
            build_dir: build/release
            client_bin: group2
            server_bin: server
            archive_suffix: linux-x86_64

          - name: macOS
            os: macos-latest
            preset: release
            cc: clang
            cxx: clang++
            build_dir: build/release
            client_bin: group2
            server_bin: server
            archive_suffix: macos

          - name: Windows
            os: windows-latest
            preset: release
            cc: clang-cl
            cxx: clang-cl
            build_dir: build/release
            client_bin: group2.exe
            server_bin: server.exe
            archive_suffix: windows-x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Windows C: drive is slow (~4K IOPS); a Dev Drive VHDX gives ~128K IOPS.
      - name: Setup Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@v3
        with:
          workspace-copy: true
          drive-size: 4GB

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang \
            glslang-tools spirv-cross \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxkbcommon-dev libxtst-dev \
            libwayland-dev wayland-protocols \
            libpulse-dev libasound2-dev \
            libdbus-1-dev libudev-dev \
            libgl-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          which ninja || brew install ninja
          brew install glslang spirv-cross
          echo "$(brew --prefix glslang)/bin"    >> "$GITHUB_PATH"
          echo "$(brew --prefix spirv-cross)/bin" >> "$GITHUB_PATH"

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Vulkan SDK provides glslc (GLSL → SPIR-V) and spirv-cross (SPIR-V → MSL).
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          cache: true

      # Strawberry Perl ships a ccache.exe that hijacks compiler launcher
      # invocations and breaks RC (resource compiler) dep tracking.
      - name: Remove Strawberry ccache (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: rm -f /c/Strawberry/c/bin/ccache.exe

      # Pin to v0.14.0 — v0.15.0 has cache-write errors on GHA.
      # Windows uses clang-cl (not MSVC cl) so sccache works on all platforms.
      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.9
        with:
          version: "v0.14.0"

      # Cache dep sources AND their build dirs (CMakeCache.txt holds
      # try_compile results, compiler probes, feature detection).
      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: .deps/${{ matrix.preset }}
          key: deps-v4-${{ runner.os }}-${{ matrix.preset }}-${{ matrix.cc }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-v4-${{ runner.os }}-${{ matrix.preset }}-${{ matrix.cc }}-

      # Cache the project build tree for incremental CMake reconfigure.
      # CMakeCache.txt + CMakeFiles hold cached probe results; Ninja tracks
      # source deps, but generated PCH/object files are still tied to the
      # exact compiler identity. On Windows, clang-cl encodes _MSC_FULL_VER in
      # its PCH target, which can change even when VCToolsVersion does not.
      - name: Compute compiler cache fingerprint
        id: compiler-cache
        shell: bash
        env:
          CC: ${{ matrix.cc || '' }}
          CXX: ${{ matrix.cxx || '' }}
        run: |
          # GHA's `shell: bash` runs with `-e -o pipefail`. Both probes below
          # close the pipe early (head -n 1, awk … exit), which sends SIGPIPE
          # to the compiler and surfaces as a non-zero pipe stage that
          # pipefail would propagate. Disable pipefail for this whole probe
          # — partial fingerprint data is fine, the fallback inputs
          # (VCToolsVersion, WindowsSDKVersion) still vary the cache key.
          set +o pipefail
          compiler="${CXX:-${CC:-c++}}"
          version="$("$compiler" --version 2>&1 | head -n 1 | tr -d '\r' || true)"
          msvc_full_ver=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            msvc_full_ver="$(printf '' | "$compiler" /nologo /EP /clang:-dM /TP - 2>/dev/null \
              | awk '/#define _MSC_FULL_VER/ { print $3; exit }' || true)"
          fi
          fingerprint="${RUNNER_OS}|${compiler}|${version}|${VCToolsVersion:-}|${WindowsSDKVersion:-}|${msvc_full_ver}"
          echo "Compiler cache fingerprint: $fingerprint"
          if command -v sha256sum >/dev/null 2>&1; then
            key="$(printf '%s' "$fingerprint" | sha256sum | cut -d' ' -f1)"
          else
            key="$(printf '%s' "$fingerprint" | shasum -a 256 | cut -d' ' -f1)"
          fi
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "Compiler cache fingerprint: \`$fingerprint\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Cache build tree
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}
          key: build-v4-${{ runner.os }}-${{ env.ImageVersion }}-${{ steps.compiler-cache.outputs.key }}-${{ matrix.preset }}-${{ matrix.cc }}-${{ github.sha }}
          restore-keys: build-v4-${{ runner.os }}-${{ env.ImageVersion }}-${{ steps.compiler-cache.outputs.key }}-${{ matrix.preset }}-${{ matrix.cc }}-

      # Runner images periodically refresh system headers (Linux:
      # asm-generic/errno-base.h, macOS: SDK rev, Windows: clang-cl PCH
      # ties to _MSC_FULL_VER). A cached PCH built against the previous
      # mtime then fails with "file has been modified since the precompiled
      # header was built". Drop just the PCHs from both the FetchContent
      # deps cache and the project build tree — the rest of the caches
      # stay valid and the PCH regenerates on the next build.
      - name: Drop cached PCH files
        shell: bash
        run: |
          for dir in ".deps/${{ matrix.preset }}" "build/${{ matrix.preset }}"; do
            [ -d "$dir" ] || continue
            find "$dir" -type f \( -name "*.pch" -o -name "cmake_pch*.obj" \) -print -delete
          done

      - name: Configure
        shell: bash
        env:
          CC:  ${{ matrix.cc  || '' }}
          CXX: ${{ matrix.cxx || '' }}
        run: |
          cmake --preset ${{ matrix.preset }} \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON \
            ${{ matrix.extra_cmake || '' }}

      - name: Build
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }} --target group2 server clientbot --parallel

      # Pull the shared assets fetched by the fetch-assets job (rsync'd
      # fresh from cse125.ucsd.edu on each workflow run).
      - name: Download assets artifact
        uses: actions/download-artifact@v4
        with:
          name: shared-assets
          path: assets

      # Bundle group2 + server + shaders + shaders-new + config + assets into a single zip.
      - name: Package release
        shell: bash
        timeout-minutes: 10
        run: |
          DIR="group2-${{ matrix.archive_suffix }}"
          STAGE="staging/$DIR"
          mkdir -p "$STAGE"

          # Executables
          cp "${{ matrix.build_dir }}/${{ matrix.client_bin }}" "$STAGE/"
          cp "${{ matrix.build_dir }}/${{ matrix.server_bin }}" "$STAGE/"

          # Config
          cp "${{ matrix.build_dir }}/config.toml" "$STAGE/"

          # Compiled SPIR-V shaders for both shader sets used at runtime.
          cp -r "${{ matrix.build_dir }}/shaders" "$STAGE/"
          cp -r "${{ matrix.build_dir }}/shaders-new" "$STAGE/"

          # Assets rsync'd from the cse125 server by the fetch-assets job.
          cp -r assets "$STAGE/"

          # Create release zip.
          # Linux/macOS have zip pre-installed; Windows has 7z instead.
          cd staging
          if command -v zip &>/dev/null; then
            zip -r "../$DIR.zip" "$DIR"
          else
            7z a -tzip "../$DIR.zip" "$DIR"
          fi

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: group2-${{ matrix.archive_suffix }}
          path: group2-${{ matrix.archive_suffix }}.zip
          retention-days: 7

  # ------------------------------------------------------------------ #
  #  Publish to GitHub Releases once all three platform builds succeed  #
  #                                                                      #
  #  Auto-semantic-versioning from commit messages:                      #
  #    BREAKING CHANGE / feat!:  →  bump major                          #
  #    feat:                     →  bump minor                          #
  #    everything else           →  bump patch                          #
  #  First release starts at v0.1.0.                                    #
  # ------------------------------------------------------------------ #
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: release-build
    if: github.event_name == 'push'
    permissions:
      contents: write
      packages: write

    steps:
      # Full history + tags needed to compute the next semantic version.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Compute next semantic version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find the latest version tag (supports both vX.Y.Z and X.Y.Z)
          LATEST_TAG=$(git tag -l --sort=-version:refname \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)

          if [[ -z "$LATEST_TAG" ]]; then
            # No version tags yet — start at v0.1.0
            NEXT="v0.1.0"
            echo "previous=" >> "$GITHUB_OUTPUT"
          else
            echo "previous=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
            VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            # Use --no-merges to see every individual commit (including
            # those inside PR merge commits) so feat:/fix: in any commit
            # drives the version bump — not just the merge-commit subject.
            SUBJECTS=$(git log "${LATEST_TAG}..HEAD" --no-merges --pretty=format:"%s")

            if echo "$SUBJECTS" | grep -qiE 'BREAKING[- ]CHANGE|^[a-z]+(\(.+\))?!:'; then
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
            elif echo "$SUBJECTS" | grep -qiE '^feat(\(.+\))?:'; then
              MINOR=$((MINOR + 1)); PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi

            NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "tag=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "### Computed version: ${NEXT}" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate changelog
        id: changelog
        env:
          GH_TOKEN: ${{ github.token }}
          PREV_TAG:     ${{ steps.version.outputs.previous }}
          RELEASE_TAG:  ${{ steps.version.outputs.tag }}
        run: |
          RANGE="${PREV_TAG:+${PREV_TAG}..HEAD}"
          RANGE="${RANGE:-HEAD}"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          ROOT=$(git rev-list --max-parents=0 HEAD | head -1)
          COMPARE_BASE="${PREV_TAG:-$ROOT}"

          # ── Build SHA → @username map via GitHub compare API ──
          # Single API call resolves git authors to GitHub logins.
          gh api "repos/${GITHUB_REPOSITORY}/compare/${COMPARE_BASE}...${GITHUB_SHA}" \
            --jq '.commits[] | "\(.sha[:7])\t@\(.author.login // .commit.author.name)"' \
            > /tmp/author_map.tsv 2>/dev/null || true

          # ── Categorise individual (non-merge) commits ──
          FEATS=""
          FIXES=""
          OTHER=""
          SEEN_AUTHORS=""

          while IFS=$'\t' read -r sha subject author_name || [[ -n "$sha" ]]; do
            # Resolve to GitHub @username; fall back to git author name
            author=$(grep "^${sha}" /tmp/author_map.tsv 2>/dev/null | cut -f2 | head -1)
            author="${author:-${author_name}}"

            # Track unique contributors
            if [[ -n "$author" ]] && ! echo "$SEEN_AUTHORS" | grep -qF "$author"; then
              SEEN_AUTHORS="${SEEN_AUTHORS} ${author}"
            fi

            ENTRY="${subject} — ${author}"

            if echo "$subject" | grep -qiE '^feat(\(.+\))?[!]?:'; then
              FEATS="${FEATS}\n- ${ENTRY}"
            elif echo "$subject" | grep -qiE '^fix(\(.+\))?[!]?:'; then
              FIXES="${FIXES}\n- ${ENTRY}"
            else
              OTHER="${OTHER}\n- ${ENTRY}"
            fi
          done < <(git log "$RANGE" --no-merges --pretty=format:"%h%x09%s%x09%an" --reverse)

          # ── Build categorised section ──
          CHANGELOG=""
          if [[ -n "$FEATS" ]]; then
            CHANGELOG="${CHANGELOG}## Features\n${FEATS}\n\n"
          fi
          if [[ -n "$FIXES" ]]; then
            CHANGELOG="${CHANGELOG}## Fixes\n${FIXES}\n\n"
          fi
          if [[ -n "$OTHER" ]]; then
            CHANGELOG="${CHANGELOG}## Other\n${OTHER}\n\n"
          fi

          # ── Stats: this release ──
          COMMIT_COUNT=$(git rev-list --count --no-merges "$RANGE" 2>/dev/null || echo "0")
          DIFF_STATS=$(git diff --shortstat "${COMPARE_BASE}..HEAD" 2>/dev/null || echo "")
          FILES_CHG=$(echo "$DIFF_STATS" | grep -oE '[0-9]+ files?' | grep -oE '[0-9]+' || echo "0")
          INS=$(echo "$DIFF_STATS" | grep -oE '[0-9]+ insertion' | grep -oE '[0-9]+' || echo "0")
          DEL=$(echo "$DIFF_STATS" | grep -oE '[0-9]+ deletion' | grep -oE '[0-9]+' || echo "0")
          NET=$(( ${INS:-0} - ${DEL:-0} ))
          [[ $NET -ge 0 ]] && NET_FMT="+${NET}" || NET_FMT="${NET}"

          # ── Stats: repository totals ──
          TOTAL_COMMITS=$(git rev-list --count HEAD)
          TOTAL_FILES=$(find src -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) 2>/dev/null | wc -l | tr -d ' ')
          TOTAL_LOC=$(find src -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) \
            -exec cat {} + 2>/dev/null | wc -l | tr -d ' ')

          CHANGELOG="${CHANGELOG}## Stats\n"
          CHANGELOG="${CHANGELOG}**${COMMIT_COUNT}** commits  ·  "
          CHANGELOG="${CHANGELOG}**${FILES_CHG}** files changed  ·  "
          CHANGELOG="${CHANGELOG}**+${INS}** / **-${DEL}** lines (net ${NET_FMT})\n"
          CHANGELOG="${CHANGELOG}Repository: **${TOTAL_LOC}** lines across **${TOTAL_FILES}** source files  ·  **${TOTAL_COMMITS}** total commits\n\n"

          # ── Contributors ──
          if [[ -n "${SEEN_AUTHORS// /}" ]]; then
            CHANGELOG="${CHANGELOG}## Contributors\n"
            for c in $SEEN_AUTHORS; do
              CHANGELOG="${CHANGELOG}${c} "
            done
            CHANGELOG="${CHANGELOG}\n\n"
          fi

          # ── Append "New Contributors" from GitHub auto-generated notes ──
          GH_NOTES=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${RELEASE_TAG}" \
            -f target_commitish="${GITHUB_SHA}" \
            ${PREV_TAG:+-f previous_tag_name="${PREV_TAG}"} \
            --jq '.body' 2>/dev/null || echo "")

          if [[ -n "$GH_NOTES" ]]; then
            NEW_CONTRIB=$(echo "$GH_NOTES" | sed -n '/^## New Contributors/,/^## /{ /^## [^N]/d; p; }')
            if [[ -n "$NEW_CONTRIB" ]]; then
              CHANGELOG="${CHANGELOG}${NEW_CONTRIB}\n\n"
            fi
          fi

          # Compare link
          if [[ -n "$PREV_TAG" ]]; then
            CHANGELOG="${CHANGELOG}**Full changelog**: ${REPO_URL}/compare/${PREV_TAG}...${RELEASE_TAG}"
          fi

          echo -e "$CHANGELOG" > changelog.md

      # Ask Gemini to write a short human-readable summary of the changes.
      # Sends the categorised changelog AND detailed per-commit stats
      # (files changed, insertions, deletions, diffstat) so the summary
      # is well-informed.  Falls back gracefully — if the API call fails
      # the release still ships with just the categorised changelog.
      - name: Generate AI summary
        id: summary
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI }}
          PREV_TAG: ${{ steps.version.outputs.previous }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          CHANGELOG=$(cat changelog.md)

          RANGE="${PREV_TAG:+${PREV_TAG}..HEAD}"
          RANGE="${RANGE:-HEAD}"

          # Detailed per-commit info: hash, subject, author, date,
          # plus --stat showing which files changed and how much.
          COMMIT_DETAILS=$(git log "$RANGE" --first-parent \
            --format="%n--- commit %h ---  %s  (%an, %ad)%n" --date=short \
            --stat --stat-width=120 2>/dev/null || echo "")

          # Overall diffstat summary (total files, insertions, deletions)
          DIFF_SUMMARY=$(git diff --stat --stat-width=120 \
            "${PREV_TAG:-$(git rev-list --max-parents=0 HEAD | head -1)}"..HEAD \
            2>/dev/null | tail -1 || echo "")

          # Build the JSON payload with jq to avoid injection from
          # commit messages or file paths.
          PAYLOAD=$(jq -n \
            --arg changelog "$CHANGELOG" \
            --arg commits "$COMMIT_DETAILS" \
            --arg diffstat "$DIFF_SUMMARY" \
            --arg version "$RELEASE_TAG" \
            '{
              "contents": [{
                "parts": [{
                  "text": ("You are writing a release summary for version " + $version + " of a multiplayer C++ FPS game engine.\n\nWrite a concise 2-4 sentence summary that describes what changed in this release. Focus on what matters to players and developers: new gameplay features, bug fixes, performance improvements, infrastructure changes. Be specific about what was added or fixed, referencing actual system names when relevant.\n\nDo not use emoji. Do not use markdown formatting. Just plain text sentences.\n\nCategorised changelog:\n" + $changelog + "\n\nDetailed commit info (commit hash, message, author, date, files changed):\n" + $commits + "\n\nOverall diff statistics:\n" + $diffstat)
                }]
              }],
              "generationConfig": {
                "maxOutputTokens": 300,
                "temperature": 0.3
              }
            }')

          # Try models in order: latest preview → stable fallback.
          # Preview models can return 503/000 under load.
          MODELS="gemini-3.1-flash-lite-preview gemini-2.5-flash-lite gemini-2.0-flash-lite"
          SUMMARY=""

          for MODEL in $MODELS; do
            echo "Trying model: ${MODEL}"
            RESPONSE=$(curl -s -w "\n%{http_code}" \
              "https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${GEMINI_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              --max-time 30) || true

            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            if [[ "$HTTP_CODE" == "200" ]]; then
              SUMMARY=$(echo "$BODY" | jq -r '.candidates[0].content.parts[0].text // empty' 2>/dev/null || echo "")
              if [[ -n "$SUMMARY" ]]; then
                echo "Success with ${MODEL}"
                break
              fi
            fi
            echo "${MODEL} returned HTTP ${HTTP_CODE} — trying next model."
          done

          if [[ -n "$SUMMARY" ]]; then
            echo "$SUMMARY" > summary.txt
            echo "has_summary=true" >> "$GITHUB_OUTPUT"
          else
            echo "All models failed — skipping summary."
            echo "has_summary=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble release notes
        run: |
          BODY=""
          if [[ -f summary.txt ]]; then
            SUMMARY=$(cat summary.txt)
            BODY="## Summary\n${SUMMARY}\n\n"
          fi
          BODY="${BODY}$(cat changelog.md)"
          echo -e "$BODY" > release-notes.md

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          TITLE="${RELEASE_TAG} (${DATE})"

          gh release create "$RELEASE_TAG" \
            --title "$TITLE" \
            --notes-file release-notes.md \
            --latest \
            group2-linux-x86_64.zip \
            group2-macos.zip \
            group2-windows-x86_64.zip

      # ---------------- Docker image: ghcr.io/<owner>/group2-server ----------------
      #
      # Reuses the Linux release artifact that release-build just produced;
      # no recompile inside Docker. The Dockerfile (docker/Dockerfile.server)
      # consumes server + config.toml + assets/ from the unpacked zip.
      - name: Prepare Docker build context
        shell: bash
        run: |
          mkdir -p docker-context
          unzip -q group2-linux-x86_64.zip -d docker-context-tmp
          # The zip's top-level dir is `group2-linux-x86_64/`; flatten it.
          mv docker-context-tmp/group2-linux-x86_64/* docker-context/
          rm -rf docker-context-tmp
          cp docker/Dockerfile.server   docker-context/Dockerfile
          cp docker/.dockerignore       docker-context/.dockerignore
          # Fail loud and early if the artifact didn't actually contain
          # the binary — otherwise the downstream `docker build` would
          # emit a confusing `COPY server` error.
          test -f docker-context/server      || { echo "ERROR: server binary missing from context"; exit 1; }
          test -f docker-context/config.toml || { echo "ERROR: config.toml missing from context"; exit 1; }
          test -d docker-context/assets      || { echo "ERROR: assets/ directory missing from context"; exit 1; }
          # Sanity print so a CI log reader can confirm the layout.
          ls -la docker-context

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/group2-server
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.tag }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: docker-context
          platforms: linux/amd64
          push: true
          tags:   ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
