name: CI

on:
  push:
    branches: [main]
    tags:     ['v*.*.*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ #
  #  Debug build — PRs only; release build covers main                  #
  # ------------------------------------------------------------------ #
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'pull_request'
    env:
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            preset: debug
            cc: clang
            cxx: clang++

          - name: macOS
            os: macos-latest
            preset: debug
            cc: clang
            cxx: clang++

          - name: Windows
            os: windows-latest
            preset: debug
            cc: cl
            cxx: cl

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Windows C: drive is slow (~4K IOPS); a Dev Drive VHDX gives ~128K IOPS.
      # Creates a ReFS virtual disk and moves the workspace there.
      - name: Setup Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@v3
        with:
          workspace-copy: true
          drive-size: 4GB

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang clang-format-18 clang-tidy \
            glslang-tools spirv-cross \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxkbcommon-dev libxtst-dev \
            libwayland-dev wayland-protocols \
            libpulse-dev libasound2-dev \
            libdbus-1-dev libudev-dev \
            libgl-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          which ninja || brew install ninja
          brew install glslang spirv-cross
          echo "$(brew --prefix glslang)/bin"    >> "$GITHUB_PATH"
          echo "$(brew --prefix spirv-cross)/bin" >> "$GITHUB_PATH"

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Vulkan SDK provides glslc (GLSL → SPIR-V) and spirv-cross (SPIR-V → MSL).
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          cache: true

      # sccache is incompatible with MSVC's PDB model (assimp sets /Zi + /Fd
      # which conflicts with sccache's output caching).  Linux/macOS only.
      - name: Setup sccache
        if: runner.os != 'Windows'
        uses: mozilla/sccache-action@v0.0.9

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}/_deps
          key: deps-v2-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-v2-${{ runner.os }}-${{ matrix.preset }}-

      # Remove stale *-build and *-subbuild dirs after cache restore.
      # Those dirs contain CMakeCache.txt files that record the generator
      # used in the run that created the cache — if it differs from the
      # current run's generator, CMake fails with "generator does not match".
      # Source dirs (*-src) are left intact so FetchContent doesn't re-download.
      # sccache handles compilation caching, so re-building from source is fast.
      - name: Purge stale dep build dirs
        shell: bash
        run: |
          find build/${{ matrix.preset }}/_deps -maxdepth 1 -type d \
            \( -name '*-build' -o -name '*-subbuild' \) \
            -exec rm -rf {} + 2>/dev/null || true

      - name: Configure
        shell: bash
        env:
          CC:  ${{ matrix.cc  || '' }}
          CXX: ${{ matrix.cxx || '' }}
        run: |
          SCCACHE_FLAGS=""
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            SCCACHE_FLAGS="-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
          fi
          cmake --preset ${{ matrix.preset }} \
            $SCCACHE_FLAGS \
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON \
            ${{ matrix.extra_cmake || '' }}

      - name: Build
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }} --parallel

  # ------------------------------------------------------------------ #
  #  Format check — pinned to clang-format-18 (ships on ubuntu-24.04)  #
  # ------------------------------------------------------------------ #
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format-18
        run: sudo apt-get install -y clang-format-18
      - name: Check formatting
        run: |
          find src -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \) \
            | xargs clang-format-18 --dry-run --Werror

  # ------------------------------------------------------------------ #
  #  Release builds — optimised, no sanitizers                          #
  #  Runs on: push to main  →  updates "latest" pre-release             #
  #            tag v*.*.*   →  creates versioned release                #
  #                                                                      #
  #  Each platform produces ONE zip containing:                          #
  #    client + server + shaders/ + config.toml + assets/                #
  # ------------------------------------------------------------------ #
  release-build:
    name: Release Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push'
    env:
      SCCACHE_GHA_ENABLED: "true"
      # Google Drive file ID for the shared assets zip.
      ASSETS_GDRIVE_ID: "1_Xafht6-R_E8-gVglYFDAHvjZA8msfE4"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            preset: release
            cc: clang
            cxx: clang++
            build_dir: build/release
            client_bin: client
            server_bin: server
            archive_suffix: linux-x86_64

          - name: macOS
            os: macos-latest
            preset: release
            cc: clang
            cxx: clang++
            build_dir: build/release
            client_bin: client
            server_bin: server
            archive_suffix: macos

          - name: Windows
            os: windows-latest
            preset: release
            cc: cl
            cxx: cl
            build_dir: build/release
            client_bin: client.exe
            server_bin: server.exe
            archive_suffix: windows-x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Windows C: drive is slow (~4K IOPS); a Dev Drive VHDX gives ~128K IOPS.
      - name: Setup Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@v3
        with:
          workspace-copy: true
          drive-size: 4GB

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang \
            glslang-tools spirv-cross \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxkbcommon-dev libxtst-dev \
            libwayland-dev wayland-protocols \
            libpulse-dev libasound2-dev \
            libdbus-1-dev libudev-dev \
            libgl-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          which ninja || brew install ninja
          brew install glslang spirv-cross
          echo "$(brew --prefix glslang)/bin"    >> "$GITHUB_PATH"
          echo "$(brew --prefix spirv-cross)/bin" >> "$GITHUB_PATH"

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Vulkan SDK provides glslc (GLSL → SPIR-V) and spirv-cross (SPIR-V → MSL).
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          cache: true

      # Ensure Python is available consistently across all runners (for gdown).
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # sccache is incompatible with MSVC's PDB model (assimp sets /Zi + /Fd
      # which conflicts with sccache's output caching).  Linux/macOS only.
      - name: Setup sccache
        if: runner.os != 'Windows'
        uses: mozilla/sccache-action@v0.0.9

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}/_deps
          key: deps-v2-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-v2-${{ runner.os }}-${{ matrix.preset }}-

      # Remove stale *-build and *-subbuild dirs after cache restore.
      # Those dirs contain CMakeCache.txt files that record the generator
      # used in the run that created the cache — if it differs from the
      # current run's generator, CMake fails with "generator does not match".
      # Source dirs (*-src) are left intact so FetchContent doesn't re-download.
      # sccache handles compilation caching, so re-building from source is fast.
      - name: Purge stale dep build dirs
        shell: bash
        run: |
          find build/${{ matrix.preset }}/_deps -maxdepth 1 -type d \
            \( -name '*-build' -o -name '*-subbuild' \) \
            -exec rm -rf {} + 2>/dev/null || true

      - name: Configure
        shell: bash
        env:
          CC:  ${{ matrix.cc  || '' }}
          CXX: ${{ matrix.cxx || '' }}
        run: |
          SCCACHE_FLAGS=""
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            SCCACHE_FLAGS="-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
          fi
          cmake --preset ${{ matrix.preset }} \
            $SCCACHE_FLAGS \
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON \
            ${{ matrix.extra_cmake || '' }}

      # Only build the client and server targets (skip group2 / HybridRenderer).
      - name: Build
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }} --target client server --parallel

      # Download the shared assets zip from Google Drive using gdown.
      - name: Download assets
        shell: bash
        run: |
          pip install --quiet gdown
          gdown "https://drive.google.com/uc?id=${ASSETS_GDRIVE_ID}" -O assets.zip

      # Bundle client + server + shaders + config + assets into a single zip.
      - name: Package release
        shell: bash
        run: |
          DIR="group2-${{ matrix.archive_suffix }}"
          STAGE="staging/$DIR"
          mkdir -p "$STAGE"

          # Executables
          cp "${{ matrix.build_dir }}/${{ matrix.client_bin }}" "$STAGE/"
          cp "${{ matrix.build_dir }}/${{ matrix.server_bin }}" "$STAGE/"

          # Config
          cp "${{ matrix.build_dir }}/config.toml" "$STAGE/"

          # Compiled SPIR-V shaders (legacy set used by the client target)
          cp -r "${{ matrix.build_dir }}/shaders" "$STAGE/"

          # Assets from Google Drive (cross-platform extraction via Python)
          python3 -c "import zipfile; zipfile.ZipFile('assets.zip').extractall('$STAGE')"

          # Create release zip.
          # Linux/macOS have zip pre-installed; Windows has 7z instead.
          cd staging
          if command -v zip &>/dev/null; then
            zip -r "../$DIR.zip" "$DIR"
          else
            7z a -tzip "../$DIR.zip" "$DIR"
          fi

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: group2-${{ matrix.archive_suffix }}
          path: group2-${{ matrix.archive_suffix }}.zip
          retention-days: 7

  # ------------------------------------------------------------------ #
  #  Publish to GitHub Releases once all three platform builds succeed  #
  # ------------------------------------------------------------------ #
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: release-build
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Determine release metadata
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}"                                  >> "$GITHUB_OUTPUT"
            echo "title=${GITHUB_REF_NAME}"                                >> "$GITHUB_OUTPUT"
            echo "prerelease=false"                                        >> "$GITHUB_OUTPUT"
            echo "notes=Versioned release ${GITHUB_REF_NAME}."            >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest"                                              >> "$GITHUB_OUTPUT"
            echo "title=Latest Build"                                      >> "$GITHUB_OUTPUT"
            echo "prerelease=true"                                         >> "$GITHUB_OUTPUT"
            echo "notes=Automated build from \`main\` — commit ${GITHUB_SHA}." >> "$GITHUB_OUTPUT"
          fi

      - name: Delete existing 'latest' release (rolling update)
        if: steps.meta.outputs.tag == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG:        ${{ steps.meta.outputs.tag }}
          RELEASE_TITLE:      ${{ steps.meta.outputs.title }}
          RELEASE_NOTES:      ${{ steps.meta.outputs.notes }}
          RELEASE_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            $PRERELEASE_FLAG \
            group2-linux-x86_64.zip \
            group2-macos.zip \
            group2-windows-x86_64.zip
